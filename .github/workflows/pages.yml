name: Publish public Mesh pages

on:
  workflow_dispatch:
    inputs:
      confirm_legal_review:
        description: "Terms and Privacy were reviewed and approved for publication"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: mesh-public-pages
  cancel-in-progress: false

jobs:
  validate:
    name: Validate public pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mesh/package-lock.json
      - name: Require owner legal review
        if: ${{ inputs.confirm_legal_review != true }}
        run: |
          echo "Terms and Privacy must be owner-reviewed before publication." >&2
          exit 1
      - name: Validate static pages
        working-directory: mesh
        run: |
          npm ci
          npm run check:public-site

  deploy:
    name: Deploy public pages
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
