name: R3 voice infrastructure security (non-R2)

# Matrix voice is included in the signed draft candidate so it can be tested on
# real devices. This workflow keeps the R3 MatrixRTC contracts and voice-only
# images fail-closed and visible; public-beta promotion still requires the
# separate complete live acceptance campaign.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrixrtc-contracts-r3:
    name: R3 MatrixRTC and operator contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate fail-closed R3 voice contracts
        working-directory: mesh
        shell: pwsh
        run: |
          ./infra/matrixrtc/test-evidence-validation.ps1
          ./scripts/matrixrtc-preflight.ps1
          ./scripts/operator-smoke.ps1 -Milestone R3

  container-supply-chain-r3:
    name: R3 voice container SBOM and fixable high scan (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: lk-jwt-service
            image: ghcr.io/element-hq/lk-jwt-service:0.4.4@sha256:9c715697c6f7c1f538f2ee41b7b59b04a8d06bf790a7cc8c8517ccac8d28813d
          - name: livekit-server
            image: livekit/livekit-server:v1.13.5@sha256:3497163e15c48fef6e7830c78716f9e9d5edc28abf7aa90b61c86e93bbc306b1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Validate explicit R2 and R3 container boundaries
        working-directory: mesh
        run: npm run check:container-supply-chain
      - name: Generate R3 voice container SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ matrix.image }}
          format: cyclonedx-json
          output-file: r3-container-${{ matrix.name }}.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Scan R3 voice image for fixable high and critical vulnerabilities
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: ${{ matrix.image }}
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          grype-version: 0.116.1
          output-format: json
          output-file: r3-container-${{ matrix.name }}-grype.json
      - name: Upload R3 voice scan findings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: r3-container-scan-findings-${{ matrix.name }}-${{ github.sha }}
          path: |
            r3-container-${{ matrix.name }}.cdx.json
            r3-container-${{ matrix.name }}-grype.json
          if-no-files-found: error
          retention-days: 90
      - name: Install pinned Cosign for R3 signature discovery
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Discover R3 upstream keyless signature and provenance
        shell: bash
        run: |
          set +e
          cosign verify \
            --certificate-identity-regexp='.*' \
            --certificate-oidc-issuer-regexp='.*' \
            --output=json \
            '${{ matrix.image }}' > r3-container-${{ matrix.name }}-signature.json 2> r3-container-${{ matrix.name }}-signature-error.txt
          status=$?
          if [[ $status -ne 0 ]]; then
            rm -f r3-container-${{ matrix.name }}-signature-error.txt
            printf '{"status":"upstream-signature-not-discovered","requiresReviewer":true}\n' > r3-container-${{ matrix.name }}-signature.json
          fi
      - name: Upload immutable R3 voice supply-chain evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: r3-container-supply-chain-${{ matrix.name }}-${{ github.sha }}
          path: |
            r3-container-${{ matrix.name }}.cdx.json
            r3-container-${{ matrix.name }}-grype.json
            r3-container-${{ matrix.name }}-signature.json
          if-no-files-found: error
          retention-days: 30
