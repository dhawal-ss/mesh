name: Security and feature boundary

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL JavaScript and TypeScript SAST
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@18420e3271f74589575af831a523c833acda327f # codeql-bundle-v2.26.2
        with:
          languages: javascript-typescript
          build-mode: none
      - name: Analyze JavaScript and TypeScript
        uses: github/codeql-action/analyze@18420e3271f74589575af831a523c833acda327f # codeql-bundle-v2.26.2
        with:
          category: /language:javascript-typescript

  dependency-review:
    name: Dependency and license review
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          config-file: ./.github/dependency-review-config.yml

  feature-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@d0befba8b9ddf874327619e84c39b094edd58b66 # 1.93.0
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libsqlcipher-dev
      - name: Check Matrix production artifact
        working-directory: mesh/src-tauri
        run: cargo check --no-default-features --features matrix-backend --locked --jobs 1
      - name: Assert Matrix production tree excludes libp2p
        working-directory: mesh/src-tauri
        shell: bash
        run: |
          set -o pipefail
          if cargo tree --no-default-features --features matrix-backend -e normal,build --locked | grep -Eq '(^| )libp2p v'; then
            echo 'Matrix production dependency tree unexpectedly contains libp2p.' >&2
            exit 1
          fi
      - name: Check experimental LAN artifact
        working-directory: mesh/src-tauri
        run: cargo check --no-default-features --features legacy-p2p --locked --jobs 1

  dependency-and-secret-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@d0befba8b9ddf874327619e84c39b094edd58b66 # 1.93.0
      - name: Install pinned Rust advisory scanner
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
      - name: Report raw Rust advisory status without suppressing legacy findings
        continue-on-error: true
        run: |
          cargo audit --file mesh/src-tauri/Cargo.lock
      - name: Enforce Matrix shipping and legacy visibility policy
        working-directory: mesh
        shell: pwsh
        run: |
          ./scripts/check-matrix-release-dependencies.ps1 `
            -ReportPath release/rust-dependency-report.json
      - name: Upload Rust dependency policy evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-dependency-policy-${{ github.sha }}
          path: mesh/release/rust-dependency-report.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mesh/package-lock.json
      - name: Enforce the on-device and non-autonomous AI boundary
        working-directory: mesh
        run: |
          node --test scripts/check-ai-boundary.test.mjs
          node scripts/check-ai-boundary.mjs
      - name: Audit JavaScript dependencies
        working-directory: mesh
        run: |
          npm audit --audit-level=high
          npm audit --prefix feature-deps/matrix-voice --audit-level=high
          npm audit --prefix feature-deps/legacy-lan --audit-level=high
      - name: Scan repository history for non-URI secrets
        uses: trufflesecurity/trufflehog@18c7b1fc33e6c16b27ea66ff27cc7e642fb7cd0a # v3.90.6
        with:
          extra_args: --results=verified,unknown --exclude-detectors=URI
      - name: Scan repository history for credential-bearing URIs
        uses: trufflesecurity/trufflehog@18c7b1fc33e6c16b27ea66ff27cc7e642fb7cd0a # v3.90.6
        with:
          extra_args: --results=verified,unknown --include-detectors=URI --exclude-paths=.trufflehog-uri-excludes

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@d0befba8b9ddf874327619e84c39b094edd58b66 # 1.93.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mesh/package-lock.json
      - name: Install JavaScript dependencies
        working-directory: mesh
        run: npm ci
      - name: Generate complete-source and Matrix-artifact CycloneDX SBOMs
        working-directory: mesh
        run: |
          npm run build:matrix
          npm run generate:release-sboms
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mesh-sboms-${{ github.sha }}
          path: |
            mesh/release/source-lockfile.cdx.json
            mesh/release/matrix-windows-artifact.cdx.json
          if-no-files-found: error
          retention-days: 30

  container-supply-chain:
    name: Container SBOM and fixable high scan (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: caddy
            image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
          - name: lk-jwt-service
            image: ghcr.io/element-hq/lk-jwt-service:0.4.4@sha256:9c715697c6f7c1f538f2ee41b7b59b04a8d06bf790a7cc8c8517ccac8d28813d
          - name: livekit-server
            image: livekit/livekit-server:v1.13.5@sha256:3497163e15c48fef6e7830c78716f9e9d5edc28abf7aa90b61c86e93bbc306b1
          - name: synapse
            image: matrixdotorg/synapse:v1.157.1@sha256:d1fce43d7501428c461f2758dc10342555b946dc9f1d03c1b1b8aec1a4e8d130
          - name: nginx
            image: nginx:1.30.4-alpine@sha256:97d490c12ba55b4946b01546d1c3ed324e8d41ab1c9fcb2a616aa470620e5b46
          - name: postgres
            image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Validate exact container policy and regression contract
        working-directory: mesh
        run: npm run check:container-supply-chain
      - name: Generate digest-bound container SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ matrix.image }}
          format: cyclonedx-json
          output-file: container-${{ matrix.name }}.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Scan fixable high and critical vulnerabilities
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: ${{ matrix.image }}
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: json
          output-file: container-${{ matrix.name }}-grype.json
      - name: Install pinned Cosign for signature discovery
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Discover upstream keyless signature and provenance
        shell: bash
        run: |
          set +e
          cosign verify \
            --certificate-identity-regexp='.*' \
            --certificate-oidc-issuer-regexp='.*' \
            --output=json \
            '${{ matrix.image }}' > container-${{ matrix.name }}-signature.json 2> container-${{ matrix.name }}-signature-error.txt
          status=$?
          if [[ $status -ne 0 ]]; then
            rm -f container-${{ matrix.name }}-signature-error.txt
            printf '{"status":"upstream-signature-not-discovered","requiresReviewer":true}\n' > container-${{ matrix.name }}-signature.json
          fi
      - name: Upload immutable container supply-chain evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-supply-chain-${{ matrix.name }}-${{ github.sha }}
          path: |
            container-${{ matrix.name }}.cdx.json
            container-${{ matrix.name }}-grype.json
            container-${{ matrix.name }}-signature.json
          if-no-files-found: error
          retention-days: 30

  protected-evidence:
    name: Protected security evidence manifest
    if: always()
    needs: [codeql, dependency-review, feature-matrix, dependency-and-secret-audit, sbom, container-supply-chain]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Record and validate protected security job outcomes
        env:
          CODEQL: ${{ needs.codeql.result }}
          DEPENDENCY_REVIEW: ${{ needs.dependency-review.result }}
          FEATURE_MATRIX: ${{ needs.feature-matrix.result }}
          DEPENDENCY_AUDIT: ${{ needs.dependency-and-secret-audit.result }}
          SBOM: ${{ needs.sbom.result }}
          CONTAINERS: ${{ needs.container-supply-chain.result }}
        run: |
          node -e "const fs=require('fs'); const results={codeql:process.env.CODEQL,dependencyReview:process.env.DEPENDENCY_REVIEW,featureMatrix:process.env.FEATURE_MATRIX,dependencyAudit:process.env.DEPENDENCY_AUDIT,sbom:process.env.SBOM,containers:process.env.CONTAINERS}; const allowed=v=>v==='success'||(process.env.GITHUB_EVENT_NAME!=='pull_request'&&v==='skipped')||(process.env.GITHUB_EVENT_NAME==='pull_request'&&v==='success'); fs.mkdirSync('mesh/release',{recursive:true}); fs.writeFileSync('mesh/release/security-run-results.json',JSON.stringify({schemaVersion:1,sourceSha:process.env.GITHUB_SHA,results},null,2)+'\n'); if(Object.values(results).some(v=>!allowed(v))) process.exit(1)"
      - name: Upload protected security payload
        id: payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-r0-payload-${{ github.sha }}
          path: mesh/release/security-run-results.json
          if-no-files-found: error
          retention-days: 90
      - name: Generate protected security evidence manifest
        working-directory: mesh
        run: |
          node scripts/protected-evidence-manifest.mjs \
            --source-sha "${{ github.sha }}" \
            --tree-hash "$(git rev-parse HEAD^{tree})" \
            --workflow-name Security \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --workflow-uri "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --payload-path release/security-run-results.json \
            --payload-name security-r0-payload-${{ github.sha }} \
            --payload-uri "${{ steps.payload.outputs.artifact-url }}" \
            --payload-digest "${{ steps.payload.outputs.artifact-digest }}" \
            --command "all protected security workflow jobs" \
            --build-mode source-and-container-security \
            --features matrix-backend,legacy-p2p,container-scan \
            --retention-days 90 \
            --output release/security-protected-evidence-manifest.json
      - name: Upload protected security evidence manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-protected-evidence-${{ github.sha }}
          path: mesh/release/security-protected-evidence-manifest.json
          if-no-files-found: error
          retention-days: 90
