version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci

  - package-ecosystem: npm
    directory: /mesh
    schedule:
      interval: weekly
      day: monday
      time: "08:15"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - frontend

  - package-ecosystem: cargo
    directory: /mesh/src-tauri
    schedule:
      interval: weekly
      day: monday
      time: "08:30"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    groups:
      cargo-minor-and-patch:
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - rust

  - package-ecosystem: npm
    directory: /mesh/feature-deps/matrix-voice
    schedule:
      interval: weekly
      day: monday
      time: "08:35"
      timezone: America/Chicago
    open-pull-requests-limit: 3
    labels: [dependencies, matrix-voice]

  - package-ecosystem: npm
    directory: /mesh/feature-deps/legacy-lan
    schedule:
      interval: weekly
      day: monday
      time: "08:40"
      timezone: America/Chicago
    open-pull-requests-limit: 3
    labels: [dependencies, legacy-lan]

  - package-ecosystem: docker
    directory: /mesh/infra/homeserver
    schedule:
      interval: weekly
      day: monday
      time: "08:45"
      timezone: America/Chicago
    labels: [dependencies, containers, homeserver]

  - package-ecosystem: docker
    directory: /mesh/infra/matrixrtc
    schedule:
      interval: weekly
      day: monday
      time: "08:50"
      timezone: America/Chicago
    labels: [dependencies, containers, matrixrtc]

  - package-ecosystem: docker
    directory: /mesh/infra/matrix-spike
    schedule:
      interval: weekly
      day: monday
      time: "08:55"
      timezone: America/Chicago
    labels: [dependencies, containers, matrix-spike]
