# Merge this rate-limit zone into the nginx `http` context, then merge the
# server and locations into the TLS virtual host for matrix-rtc.example.com.
# TLS certificates and policy are intentionally operator-owned.
limit_req_zone $binary_remote_addr zone=matrixrtc_auth:10m rate=20r/s;
# LiveKit passes its short-lived JWT in the signalling query string. Never use
# nginx's default `$request` field for this virtual host because it includes
# query parameters. Keep retention short and restrict access to this log.
log_format matrixrtc_safe '$remote_addr - $remote_user [$time_local] '
                          '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                          '"$http_referer" "$http_user_agent"';

server {
    listen 443 ssl http2;
    server_name matrix-rtc.example.com;

    ssl_certificate /etc/letsencrypt/live/matrix-rtc.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/matrix-rtc.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/matrixrtc_access.log matrixrtc_safe;

    # LiveKit delivers signed participant lifecycle events over the private
    # Compose network. Do not expose the webhook receiver publicly.
    location ^~ /livekit/jwt/sfu_webhook {
        return 404;
    }

    location ^~ /livekit/jwt/ {
        # OpenID exchange requests are small JSON documents. Bound both body
        # size and per-source request rate before the Go authorization service.
        client_max_body_size 64k;
        limit_req zone=matrixrtc_auth burst=40 nodelay;
        proxy_pass http://127.0.0.1:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location ^~ /livekit/sfu/ {
        proxy_pass http://127.0.0.1:7880/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
