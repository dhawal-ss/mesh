name: mesh-homeserver

services:
  postgres:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    restart: unless-stopped
    stop_grace_period: 60s
    env_file:
      - .env
    environment:
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - ./runtime/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    shm_size: 256m
    mem_limit: 1g
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"
    networks:
      - backend

  synapse:
    image: matrixdotorg/synapse:v1.157.0@sha256:53a686c52cdfca5fdb0adff5ef10b276b1d0971931b09815a9eb6b48d7188a1a
    restart: unless-stopped
    stop_grace_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      SYNAPSE_CONFIG_PATH: /data/homeserver.yaml
    volumes:
      - ./runtime/synapse:/data
      - ./create_registration_invite.py:/mesh/create_registration_invite.py:ro
    ports:
      - "${SYNAPSE_CONTROL_BIND:-127.0.0.1}:8008:8008/tcp"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8008/health', timeout=3).read()",
        ]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 90s
    mem_limit: 2g
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"
    networks:
      - backend

  caddy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    profiles: ["public"]
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      synapse:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./runtime/well-known:/srv/well-known:ro
      - ./runtime/caddy/data:/data
      - ./runtime/caddy/config:/config
    mem_limit: 256m
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"
    networks:
      - backend

networks:
  backend:
    driver: bridge
    internal: false
