name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check-rust:
    name: Rust Check & Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libsqlcipher-dev

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            mesh/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('mesh/src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: cargo check (no warnings)
        working-directory: mesh/src-tauri
        run: cargo check 2>&1

      - name: cargo clippy
        working-directory: mesh/src-tauri
        run: cargo clippy -- -D warnings

      - name: cargo fmt check
        working-directory: mesh/src-tauri
        run: cargo fmt --check

      - name: cargo test
        working-directory: mesh/src-tauri
        run: cargo test

  check-frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mesh/package-lock.json

      - name: Install dependencies
        working-directory: mesh
        run: npm ci

      - name: TypeScript check
        working-directory: mesh
        run: npx tsc --noEmit

      - name: Run tests
        working-directory: mesh
        run: npm run test -- --run

      - name: Build frontend
        working-directory: mesh
        run: npm run build
